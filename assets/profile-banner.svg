    </filter>
  </defs>
  <rect width="960" height="560" rx="42" fill="url(#bg)"/>
  <circle cx="780" cy="90" r="170" fill="#2563eb" opacity="0.18" filter="url(#glow)"/>
  <circle cx="190" cy="480" r="180" fill="#14b8a6" opacity="0.15" filter="url(#glow)"/>
  <g opacity="0.14" stroke="#bfdbfe">

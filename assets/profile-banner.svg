  <text x="80" y="132" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="54" font-weight="700">BUILDING WITH AI</text>
  <text x="84" y="184" fill="#93c5fd" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" letter-spacing="3">PRODUCT · MODELS · PEOPLE</text>
